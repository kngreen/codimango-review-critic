name: contract

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install black==25.11.0
      - name: Verify review protocol
        run: bash scripts/verify_release.sh --mode ci --sha "$GITHUB_SHA"
